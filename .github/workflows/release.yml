name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Run static checks and offline tests
        run: ./check.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package addon
        run: |
          mkdir -p dist/JRawrCharacterExporter
          cp JRawrCharacterExporter.toc JRawrCharacterExporterClasses.lua \
             JRawrCharacterExporter.lua JRawrCharacterExporterData.lua \
             README.md LICENSE NOTICE \
             dist/JRawrCharacterExporter/
          cd dist
          zip -r "../JRawrCharacterExporter-${GITHUB_REF_NAME}.zip" JRawrCharacterExporter
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" JRawrCharacterExporter-*.zip --generate-notes
