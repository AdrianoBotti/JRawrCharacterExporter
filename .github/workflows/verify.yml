name: verify

on:
  workflow_call:
    inputs:
      jrawr_ref:
        description: JRawr branch, tag or commit to test against
        required: false
        type: string
        default: master

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Run static checks and offline tests
        run: ./check.sh

  jrawr-import:
    uses: ./.github/workflows/jrawr-import.yml
    with:
      jrawr_ref: ${{ inputs.jrawr_ref }}
